
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: "androidx.navigation.safeargs"
apply plugin: 'com.chaquo.python'
// 상단 somewhere에 아래 코드 추가 또는 수정

android {
    compileSdkVersion 35
    defaultConfig {
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        applicationId "com.echoshot.app"
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 8
        versionName "1.0.7"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a" // , "x86", "x86_64"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }


    signingConfigs {
        release {
            // gradle.properties에서 읽어온 값들
            storeFile file(ECHO_KEYSTORE_PATH)
            storePassword ECHO_KEYSTORE_PASSWORD
            keyAlias ECHO_KEY_ALIAS
            keyPassword ECHO_KEY_PASSWORD
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release   // 이거 꼭 있어야 함
        }
        debug {
            debuggable true
        }
    }

    namespace 'com.echoshot.app'

    // Set the source of tests to same for both Unit and Instrumented tests
    sourceSets {
        String sharedTestDir = 'src/test/java'
        main {
            java.srcDirs += "src/main/java"
            // 이 줄을 추가하면 Android 뷰에서도 python 폴더가 보입니다
            python.srcDir "src/main/python"
        }
        test {
            java.srcDir sharedTestDir
        }
        androidTest {
            java.srcDir sharedTestDir
        }
    }

    buildFeatures {
        viewBinding true
    }

    aaptOptions {
        noCompress "ptl", "pt", "tflite"
    }

    packaging {
        jniLibs {
            // 중복되는 libc++_shared.so는 첫 번째 것만 포함
            pickFirsts += ["**/libc++_shared.so"]
        }
    }
}

chaquopy {
    defaultConfig {
        // pip 을 통해 번들할 외부 패키지들
        pip {
            install "numpy"
            // install "opencv-python-headless" // 사용하지 않음 - 제거하여 크기 감소
            // install "scipy" // 사용하지 않음 - 제거하여 크기 감소
            // install "matplotlib" 등 추가 가능
        }
        // (필요 시) Python 버전 지정
        // version = "3.11"
    }
}

dependencies {
    implementation project(':utils')

    // Kotlin lang
    implementation 'androidx.core:core-ktx:1.3.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.3.4'

    // App compat and UI things
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'

    // RecyclerView
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    
    // SwipeRefreshLayout
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // EGL compat
    implementation 'androidx.graphics:graphics-core:1.0.0-alpha05'
    // implementation 'com.google.ar:core:1.50.0' // ARCore 사용하지 않음 - 제거하여 크기 감소
    // implementation 'com.google.ai.edge.litert:litert-gpu:1.4.0'

    // Navigation library
    def nav_version = "2.2.2"
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"

    // tensorflow library (버전 통일)
    // tensorflow library
    implementation 'org.tensorflow:tensorflow-lite:2.13.0'
    implementation 'org.tensorflow:tensorflow-lite-gpu:2.13.0'
    implementation 'org.tensorflow:tensorflow-lite-task-vision:0.4.4'
    implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'
    implementation "org.tensorflow:tensorflow-lite-gpu-api:2.13.0"
    // implementation "org.tensorflow:tensorflow-lite-select-tf-ops:2.13.0" // 사용하지 않음 - 제거하여 크기 감소


    //gson
    implementation 'com.google.code.gson:gson:2.10.1'
    // Glide for image/video thumbnail loading
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    kapt 'com.github.bumptech.glide:compiler:4.15.1'

    //ffmpeg-kit
    implementation "io.github.maitrungduc1410:ffmpeg-kit-min:6.0.1"

    implementation "androidx.viewpager2:viewpager2:1.0.0"
    implementation "com.google.android.material:material:1.12.0"

    // ★ CameraX — 모두 명시 버전(PreviewView는 camera-view에 포함)
    implementation 'androidx.camera:camera-core:1.3.3'
    implementation 'androidx.camera:camera-camera2:1.3.3'
    implementation 'androidx.camera:camera-lifecycle:1.3.3'
    implementation 'androidx.camera:camera-view:1.3.3'
    // implementation 'androidx.camera:camera-extensions:1.3.3' // 사용하지 않음 - 제거하여 크기 감소

    implementation project(':opencv') // <- 임포트한 OpenCV 모듈명
    implementation "org.pytorch:pytorch_android_lite:2.1.0"
    implementation "org.pytorch:pytorch_android_torchvision_lite:2.1.0"
}
